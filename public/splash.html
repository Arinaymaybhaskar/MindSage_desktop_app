<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindSage</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Ubuntu,
          Cantarell,
          Noto Sans,
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      /* Matches the app's own dark surface + border tokens
         (--color-surface-dark, --color-border-dark) rather than an
         unrelated gradient, so the splash reads as the same product. */
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        min-width: 240px;
        padding: 28px 32px;
        background: hsl(0, 0%, 10%);
        border: 1px solid hsl(0, 0%, 100%, 0.06);
        border-radius: 14px;
      }
      .logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
      }
      /* The static SVG paints instantly and shares the Rive artwork's exact
         shapes/colors, so cross-fading the canvas in over it (once the wasm
         runtime has actually loaded) reads as one continuous logo rather
         than a pop-in - there's no gap where the card just sits empty. */
      .logo-wrap svg,
      .logo-wrap canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .logo-wrap canvas {
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .logo-wrap canvas.ready {
        opacity: 1;
      }
      .name {
        font-size: 15px;
        font-weight: 600;
        color: hsl(0, 0%, 95%);
        letter-spacing: 0.2px;
      }
      .status {
        font-size: 12px;
        color: hsl(0, 0%, 70%);
      }
    </style>
  </head>
