<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MindSage</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      .card {
        background: linear-gradient(
          180deg,
          rgba(17, 17, 22, 0.95),
          rgba(25, 25, 32, 0.95)
        );
        color: white;
        padding: 20px 28px;
        border-radius: 16px;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        min-width: 280px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #8b5cf6; /* violet-500 */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
      }
      .name {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .tagline {
        font-size: 12px;
        opacity: 0.8;
        margin-top: -2px;
      }
      .status {
        font-size: 12px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img class="logo" src="./assets/icon.png" alt="MindSage" />
        <div>
          <div class="name">MindSage</div>
          <div class="tagline">Your mindful productivity companion</div>
        </div>
      </div>
      <div class="spinner" aria-hidden="true"></div>
      <div id="status" class="status" role="status">
        Starting Application...
      </div>
    </div>
    <script>
      try {
        const { ipcRenderer } = require("electron");
        const statusEl = document.getElementById("status");
        ipcRenderer.on("splash-status", (_evt, text) => {
          if (statusEl && typeof text === "string") statusEl.textContent = text;
        });
      } catch (e) {
        // non-Electron fallback: do nothing
      }
    </script>
  </body>
</html>
