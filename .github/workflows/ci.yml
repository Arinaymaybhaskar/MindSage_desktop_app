name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20 is the local/Electron dev version (.nvmrc), but a transitive
          # dependency of jsdom@30 (@asamuzakjp/css-color) requires Node
          # >=22.13, which broke `npm ci` here since jsdom was bumped to v30.
          # 22 is already in package.json's own declared engines range.
          node-version: 22
          cache: npm

      # Skip lifecycle scripts: postinstall runs electron-rebuild (native
      # better-sqlite3 build) which the typecheck/lint steps don't need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Every step below blocks. Typecheck and lint were report-only while the
      # codebase carried 131 and 106 pre-existing problems; both are now at zero,
      # so a non-zero exit here means the change under review introduced it.
      - name: Typecheck (renderer)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # .gitattributes forces an LF working tree on every platform, so this
      # gives the same answer here as it does on a contributor's machine.
      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test
