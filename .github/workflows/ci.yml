name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Skip lifecycle scripts: postinstall runs electron-rebuild (native
      # better-sqlite3 build) which the typecheck/lint steps don't need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # NOTE: typecheck and lint are report-only for now — the codebase has
      # pre-existing errors (see TECHNICAL_DEBT.md / TODO.md). Remove the
      # `continue-on-error` lines once those are cleared so CI blocks merges
      # on new failures.
      - name: Typecheck (renderer)
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true
