name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20 is the local/Electron dev version (.nvmrc), but a transitive
          # dependency of jsdom@30 (@asamuzakjp/css-color) requires Node
          # >=22.13, which broke `npm ci` here since jsdom was bumped to v30.
          # 22 is already in package.json's own declared engines range.
          node-version: 22
          cache: npm

      # Skip lifecycle scripts: postinstall runs electron-rebuild (native
      # better-sqlite3 build) which the typecheck/lint steps don't need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Every step below blocks. Typecheck and lint were report-only while the
      # codebase carried 131 and 106 pre-existing problems; both are now at zero,
      # so a non-zero exit here means the change under review introduced it.
      - name: Typecheck (renderer)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # .gitattributes forces an LF working tree on every platform, so this
      # gives the same answer here as it does on a contributor's machine.
      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

  # better-sqlite3 is built for Electron's ABI, so these run under Electron as
  # Node (scripts/run-db-tests.mjs). `npm ci` here keeps the postinstall step
  # (electron-rebuild) that the job above skips on purpose.
  database:
    name: Database & worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (builds better-sqlite3 for Electron)
        run: npm ci

      # Migrations on real SQLite, journal CRUD, the pre-migration backup, and
      # the AI worker thread against fake Ollama and Qdrant servers. The worker
      # tests need port 11434 free, which it is on a runner.
      - name: Database and worker tests
        run: npm run test:db

  # One pass through the real app: launch, sign up, sign in, write, wait for
  # the AI's own completion events, find the entry through search. Windows
  # because that is the build that ships (resources/win/qdrant.exe), and a
  # runner has no GPU, so Ollama runs on the CPU with a 1B chat model.
  e2e:
    name: End-to-end (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (builds better-sqlite3 for Electron)
        run: npm ci

      # Models are about 1.5 GB; cached so only the first run pays for them.
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~\.ollama\models
          key: ollama-models-nomic-embed-text-v1.5-llama3.2-1b

      - name: Install Ollama
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://ollama.com/download/OllamaSetup.exe -OutFile OllamaSetup.exe
          Start-Process -FilePath .\OllamaSetup.exe -ArgumentList '/VERYSILENT','/NORESTART' -Wait

      - name: Start Ollama and pull the models
        shell: pwsh
        run: |
          $ollama = Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe'
          Start-Process -FilePath $ollama -ArgumentList 'serve' -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:11434/api/tags | Out-Null; break } catch { Start-Sleep 2 }
          }
          & $ollama pull nomic-embed-text:v1.5
          & $ollama pull llama3.2:1b

      - name: End-to-end run
        run: npm run test:e2e

      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-artifacts
