name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20 is the local/Electron dev version (.nvmrc), but a transitive
          # dependency of jsdom@30 (@asamuzakjp/css-color) requires Node
          # >=22.13, which broke `npm ci` here since jsdom was bumped to v30.
          # 22 is already in package.json's own declared engines range.
          node-version: 22
          cache: npm

      # Skip lifecycle scripts: postinstall runs electron-rebuild (native
      # better-sqlite3 build) which the typecheck/lint steps don't need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # NOTE: typecheck and lint are report-only for now — the codebase has
      # pre-existing errors (see TECHNICAL_DEBT.md / TODO.md). Remove the
      # `continue-on-error` lines once those are cleared so CI blocks merges
      # on new failures.
      - name: Typecheck (renderer)
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Tests are green, so this step blocks on failure.
      - name: Test
        run: npm test
