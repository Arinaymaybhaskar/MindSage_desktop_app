name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20 is the local/Electron dev version (.nvmrc), but a transitive
          # dependency of jsdom@30 (@asamuzakjp/css-color) requires Node
          # >=22.13, which broke `npm ci` here since jsdom was bumped to v30.
          # 22 is already in package.json's own declared engines range.
          node-version: 22
          cache: npm

      # Skip lifecycle scripts: postinstall runs electron-rebuild (native
      # better-sqlite3 build) which the typecheck/lint steps don't need.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Every step below blocks. Typecheck and lint were report-only while the
      # codebase carried 131 and 106 pre-existing problems; both are now at zero,
      # so a non-zero exit here means the change under review introduced it.
      - name: Typecheck (renderer)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # .gitattributes forces an LF working tree on every platform, so this
      # gives the same answer here as it does on a contributor's machine.
      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

  # better-sqlite3 is built for Electron's ABI, so these run under Electron as
  # Node (scripts/run-db-tests.mjs). `npm ci` here keeps the postinstall step
  # (electron-rebuild) that the job above skips on purpose.
  database:
    name: Database & index tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (builds better-sqlite3 for Electron)
        run: npm ci

      # Migrations on real SQLite, journal CRUD, the pre-migration backup, and
      # the sqlite-vec search index and the indexer loop with a fake embedding
      # model.
      - name: Database and index tests
        run: npm run test:db

  # One pass through the real app: launch, sign up, sign in, write, wait for
  # the AI's own completion events, find the entry through search. Windows
  # because that is the build that ships (sqlite-vec-windows-x64 is unpacked
  # from the asar), and a
  # runner has no GPU, so Ollama runs on the CPU with a 1B chat model.
  e2e:
    name: End-to-end (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (builds better-sqlite3 for Electron)
        run: npm ci

      # Models are about 1.5 GB; cached so only the first run pays for them.
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~\.ollama\models
          key: ollama-models-nomic-embed-text-v1.5-llama3.2-1b

      # Not OllamaSetup.exe: the installer starts "ollama app" (tray) when it
      # finishes, and Start-Process -Wait waits for that whole process tree, so
      # the step hung until the job timeout (every run since the job was added).
      - name: Install Ollama
        timeout-minutes: 5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip -OutFile ollama.zip
          Expand-Archive ollama.zip -DestinationPath "$env:RUNNER_TEMP\ollama"
          "$env:RUNNER_TEMP\ollama" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Start Ollama and pull the models
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ollama = Join-Path $env:RUNNER_TEMP 'ollama\ollama.exe'
          Start-Process -FilePath $ollama -ArgumentList 'serve' -WindowStyle Hidden -RedirectStandardOutput ollama.log -RedirectStandardError ollama.err.log
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:11434/api/tags | Out-Null; $up = $true } catch { Start-Sleep 2 }
          }
          if (-not $up) { Get-Content ollama.err.log -ErrorAction SilentlyContinue; throw 'Ollama did not answer on 127.0.0.1:11434 within 60 s' }
          foreach ($model in 'nomic-embed-text:v1.5', 'llama3.2:1b') {
            & $ollama pull $model
            if ($LASTEXITCODE -ne 0) { throw "ollama pull $model failed with exit code $LASTEXITCODE" }
          }

      - name: End-to-end run
        timeout-minutes: 20
        run: npm run test:e2e

      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: e2e-artifacts
