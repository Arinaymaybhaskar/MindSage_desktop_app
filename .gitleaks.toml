# gitleaks configuration.
# Extends the built-in ruleset; add project-specific allowlist entries below.
[extend]
useDefault = true

[allowlist]
description = "Files that legitimately contain secret-shaped placeholders (the QA kit signs up a throwaway test profile)"
paths = [
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
  '''^scripts/qa/''',
]
